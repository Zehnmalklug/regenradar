<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Regenradar</title>
<meta name="theme-color" content="#eef1f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Regenradar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: Antwort oben, Karte in der Mitte, Regenverlauf für deinen Ort unten als Zeitleiste */
:root {
  --bg: #e9edf1;
  --panel: rgba(255,255,255,.94);
  --fg: #0f1b26;
  --muted: #5a6977;
  --line: #d5dde4;
  --accent: #1f6fd6;
  --dry: #23784a;
  --shadow: 0 6px 24px rgba(15,27,38,.14);
  /* Regenstufen, gleich in Hell und Dunkel: je mehr Regen, desto dunkler und kräftiger.
     Farbton wandert von Hellblau über Blau und Violett zu Magenta. */
  --r1: #a3cff5; --r2: #6aaef3; --r3: #437cf0; --r4: #7e43e4; --r5: #af0e7f;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #12161b;
  --panel: rgba(24,30,37,.94);
  --fg: #e8edf2;
  --muted: #93a2b0;
  --line: #2c3742;
  --accent: #5aa2ff;
  --dry: #5cc28b;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.35 var(--font); overflow: hidden; overscroll-behavior: none; }
#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-control-attribution { font-size: 10px; background: var(--panel) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bottom { bottom: var(--sheet-h, 220px); }

.panel {
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
}

/* Antwortkarte */
.top {
  position: fixed; left: 12px; right: 12px; z-index: 500;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; gap: 8px; align-items: flex-start;
}
.answer { flex: 1; min-width: 0; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.drop { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--muted); }
.drop svg { width: 18px; height: 18px; }
.answer.dry .drop { background: color-mix(in srgb, var(--dry) 18%, transparent); color: var(--dry); }
.answer.wet .drop { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.answer .txt { min-width: 0; }
.answer h1 { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
.answer p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.answer .where { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btns { display: flex; flex-direction: column; gap: 8px; }
.iconbtn {
  width: 48px; height: 48px; border: 0; border-radius: 14px; color: var(--fg);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.iconbtn svg { width: 21px; height: 21px; }
.iconbtn small { display: block; font: 600 11px var(--font); margin-top: -3px; color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Unteres Panel */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 500;
  border-radius: 20px 20px 0 0;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column; gap: 10px;
}
.head { height: 20px; display: flex; align-items: center; min-width: 0; }
.head .sel { font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.strip { position: relative; height: 96px; touch-action: none; cursor: pointer; user-select: none; margin-inline: 12px; }
.bars { position: absolute; inset: 26px 0 18px 0; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); }
.empty { position: absolute; inset: 26px 0 18px 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--dry); pointer-events: none; }
.bar { flex: 1; min-width: 0; border-radius: 3px 3px 0 0; background: var(--line); height: 3px; transition: height .25s; }
.bar.sel { box-shadow: 0 0 0 2px var(--fg); }
.cursor { position: absolute; top: 12px; bottom: 16px; width: 2px; background: var(--fg); border-radius: 1px; pointer-events: none; transform: translateX(-1px); }
.handle {
  position: absolute; top: 0; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--fg); box-shadow: var(--shadow);
  display: grid; place-items: center; pointer-events: none; transition: transform .12s;
}
.handle::before { content: ""; width: 8px; height: 10px;
  background: linear-gradient(90deg, var(--fg) 0 2px, transparent 2px 3px, var(--fg) 3px 5px, transparent 5px 6px, var(--fg) 6px 8px); }
.strip.dragging .handle { transform: scale(1.15); }
.strip:focus-visible .handle { outline: 2px solid var(--accent); outline-offset: 2px; }
.axis { position: absolute; left: 0; right: 0; bottom: 0; height: 15px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.axis .now { color: var(--fg); font-weight: 600; }

.legend { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.legend div { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); min-width: 0; }
.legend i { display: block; height: 6px; border-radius: 3px; }
.legend span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sheet-h, 220px) + 12px); z-index: 600;
  border-radius: 12px; padding: 8px 12px; font-size: 12px; max-width: calc(100% - 32px); }
.me { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Karte mit Regenradar"></div>

<div class="top">
  <div class="panel answer" id="answer" aria-live="polite">
    <div class="drop" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-3.4 4.6-6.5 8.4-6.5 12A6.5 6.5 0 0 0 18.5 14.5c0-3.6-3.1-7.4-6.5-12z"/></svg>
    </div>
    <div class="txt">
      <h1 id="headline">Lade Vorhersage …</h1>
      <p id="sub">Regen für die nächsten 2 Stunden</p>
      <span class="where" id="where"></span>
    </div>
  </div>
  <div class="btns">
    <button class="panel iconbtn" id="locate" aria-label="Meinen Standort verwenden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="panel iconbtn" id="theme" aria-label="Darstellung wechseln">
      <span><svg id="themeIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></svg><small id="themeLbl">Auto</small></span>
    </button>
  </div>
</div>

<div class="panel toast" id="toast" hidden></div>

<div class="panel sheet" id="sheet">
  <div class="head">
    <span class="sel" id="sel">--:--</span>
  </div>
  <div class="strip" id="strip" role="slider" aria-label="Zeitpunkt wählen" tabindex="0" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0">
    <div class="bars" id="bars"></div>
    <div class="empty" id="empty" hidden>Durchgehend trocken</div>
    <div class="cursor" id="cursor"></div>
    <div class="handle" id="handle" aria-hidden="true"></div>
    <div class="axis" id="axis"></div>
  </div>
    <div class="legend" aria-label="Legende">
      <div><i style="background:var(--r1)"></i><span>Niesel</span></div>
      <div><i style="background:var(--r2)"></i><span>leicht</span></div>
      <div><i style="background:var(--r3)"></i><span>mäßig</span></div>
      <div><i style="background:var(--r4)"></i><span>stark</span></div>
      <div><i style="background:var(--r5)"></i><span>Unwetter</span></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  // ---------- Konfiguration ----------
  const WMS = "https://maps.dwd.de/geoserver/dwd/wms";
  const LAYER = "dwd:Niederschlagsradar";      // mm/h, Messung + Nowcast bis +2 h
  const BRIGHTSKY = "https://api.brightsky.dev/radar";
  const HOME = { lat: 53.5511, lon: 9.9937, label: "Hamburg" };
  const STEP = 5 * 60000;
  const PLACE_ZOOM = 10;   // Startansicht: Ort mit Umgebung von etwa 30 km

  // Klassen in mm/h. Gleiche Schwellen für Karte und Punktwert.
  const CLASSES = [
    { min: 0.1, word: "Niesel" },
    { min: 0.4, word: "leichter Regen" },
    { min: 2,   word: "mäßiger Regen" },
    { min: 5,   word: "starker Regen" },
    { min: 15,  word: "Unwetter" },
  ];
  const classOf = mmh => { let c = -1; CLASSES.forEach((k, i) => { if (mmh >= k.min) c = i; }); return c; };

  // DWD-Farbpalette (aus GetLegendGraphic) -> unsere Klasse
  const DWD_PALETTE = {
    "33FFFF": 0, "1ACC9A": 0,
    "019934": 1, "4DB31B": 1,
    "99CC01": 2, "CCE601": 2,
    "FFFF01": 3, "FFC401": 3, "FF8901": 3,
    "FF4501": 4, "FE0000": 4, "E5004C": 4, "CC0098": 4, "6600CB": 4, "0000FE": 4,
  };
  const LUT = new Map(Object.entries(DWD_PALETTE).map(([hex, c]) => [parseInt(hex, 16), c]));

  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = d => d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const load = k => { try { return JSON.parse(localStorage.getItem("rr." + k)); } catch { return null; } };
  const save = (k, v) => { try { localStorage.setItem("rr." + k, JSON.stringify(v)); } catch {} };

  // ---------- Theme ----------
  const sys = matchMedia("(prefers-color-scheme: dark)");
  let themeMode = load("theme") || "auto";   // auto | light | dark
  let classRGBA = [];
  const ICONS = {
    auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>',
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    dark: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  };
  const isDark = () => themeMode === "dark" || (themeMode === "auto" && sys.matches);

  function applyTheme() {
    const dark = isDark();
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = dark ? "#12161b" : "#e9edf1";
    $("themeIco").innerHTML = ICONS[themeMode];
    $("themeLbl").textContent = { auto: "Auto", light: "Hell", dark: "Dunkel" }[themeMode];
    classRGBA = ["--r1", "--r2", "--r3", "--r4", "--r5"].map((v, i) => {
      const h = css(v).replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), [190, 210, 230, 240, 245][i]];
    });
    if (map) { setBase(); rebuildRadar(); renderStrip(); }
  }
  $("theme").addEventListener("click", () => {
    themeMode = { auto: "light", light: "dark", dark: "auto" }[themeMode];
    save("theme", themeMode); applyTheme();
    toast({ auto: "Darstellung folgt dem System", light: "Helle Darstellung", dark: "Dunkle Darstellung" }[themeMode]);
  });
  sys.addEventListener?.("change", () => themeMode === "auto" && applyTheme());

  // ---------- Karte ----------
  let map = null;
  const place = load("place") || HOME;
  map = L.map("map", { zoomControl: false, minZoom: 5, maxZoom: 13 })
    .setView([place.lat, place.lon], PLACE_ZOOM);
  map.attributionControl.setPrefix(false);

  const ESRI = "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  const baseLayer = L.tileLayer("", { maxZoom: 16, attribution: 'Karte: Esri, HERE, Garmin, &copy; OpenStreetMap | Radar: <a href="https://www.dwd.de">Deutscher Wetterdienst</a>, <a href="https://brightsky.dev">Bright Sky</a>' }).addTo(map);
  const labelPane = map.createPane("labels"); labelPane.style.zIndex = 450; labelPane.style.pointerEvents = "none";
  const labelLayer = L.tileLayer("", { maxZoom: 16, pane: "labels" }).addTo(map);
  function setBase() {
    const v = isDark() ? "World_Dark_Gray" : "World_Light_Gray";
    baseLayer.setUrl(`${ESRI}${v}_Base/MapServer/tile/{z}/{y}/{x}`);
    labelLayer.setUrl(`${ESRI}${v}_Reference/MapServer/tile/{z}/{y}/{x}`);
  }

  // Radar-Kacheln: DWD-WMS laden, in Regenklassen übersetzen, Kanten weich rechnen, neu einfärben.
  // Glättung: Klassenfeld weichzeichnen und wieder in Klassen schneiden. Ergibt runde Konturen
  // mit klaren Grenzen statt 1-km-Treppen. Die Kachel wird mit Rand geladen, damit keine Nähte entstehen.
  const CAN_BLUR = "filter" in CanvasRenderingContext2D.prototype;
  const STEPV = 42;   // Grauwert pro Klasse im Hilfsbild
  const RadarLayer = L.GridLayer.extend({
    createTile(coords, done) {
      const size = this.getTileSize();
      const tile = document.createElement("canvas");
      tile.width = size.x; tile.height = size.y;
      const crs = L.CRS.EPSG3857;
      const nwPx = coords.scaleBy(size), sePx = nwPx.add(size);
      const nwLL = map.unproject(nwPx, coords.z), seLL = map.unproject(sePx, coords.z);
      const p1 = crs.project(nwLL), p2 = crs.project(seLL);
      const res = (p2.x - p1.x) / size.x;                       // projizierte Meter pro Pixel
      const lat = (nwLL.lat + seLL.lat) / 2 * Math.PI / 180;
      const cellPx = 1000 / Math.cos(lat) / res;                 // ein 1-km-Rasterfeld in Pixeln
      const blur = CAN_BLUR ? Math.min(24, cellPx * 0.6) : 0;
      const pad = blur >= 0.5 ? Math.ceil(blur * 2) + 2 : 0;
      const W = size.x + 2 * pad, H = size.y + 2 * pad;
      const bbox = [p1.x - pad * res, p2.y - pad * res, p2.x + pad * res, p1.y + pad * res].join(",");
      const url = `${WMS}?service=WMS&version=1.3.0&request=GetMap&layers=${LAYER}&styles=&format=image/png&transparent=true` +
        `&crs=EPSG:3857&width=${W}&height=${H}&bbox=${bbox}&time=${this.options.time}`;
      fetch(url).then(r => r.blob()).then(createImageBitmap).then(bmp => {
        // 1. DWD-Farben in Klassen übersetzen (0 = kein Regen, 1..5 = Stufen) als Graubild
        const src = document.createElement("canvas"); src.width = W; src.height = H;
        const sctx = src.getContext("2d", { willReadFrequently: true });
        sctx.drawImage(bmp, 0, 0);
        const si = sctx.getImageData(0, 0, W, H), s = si.data;
        let any = false;
        for (let i = 0; i < s.length; i += 4) {
          const c = s[i + 3] === 255 ? LUT.get((s[i] << 16) | (s[i + 1] << 8) | s[i + 2]) : undefined;
          const v = c === undefined ? 0 : (c + 1) * STEPV;
          if (v) any = true;
          s[i] = s[i + 1] = s[i + 2] = v; s[i + 3] = 255;
        }
        if (!any) { done(null, tile); return; }
        sctx.putImageData(si, 0, 0);
        // 2. Weichzeichnen
        const soft = document.createElement("canvas"); soft.width = W; soft.height = H;
        const fctx = soft.getContext("2d", { willReadFrequently: true });
        if (blur >= 0.5) fctx.filter = `blur(${blur.toFixed(1)}px)`;
        fctx.drawImage(src, 0, 0);
        const fd = fctx.getImageData(pad, pad, size.x, size.y), f = fd.data;
        // 3. Zurück in Klassen schneiden und einfärben
        for (let i = 0; i < f.length; i += 4) {
          const c = Math.round(f[i] / STEPV) - 1;
          if (c < 0) { f[i + 3] = 0; continue; }
          const t = classRGBA[Math.min(c, 4)]; f[i] = t[0]; f[i + 1] = t[1]; f[i + 2] = t[2]; f[i + 3] = t[3];
        }
        tile.getContext("2d").putImageData(fd, 0, 0);
        done(null, tile);
      }).catch(err => done(err, tile));
      return tile;
    }
  });

  // ---------- Zustand ----------
  let frames = [];     // {t: Date, mmh: number|null, layer}
  let idx = 0, timer = null, pointOk = false;

  function frameTimes() {
    // Neuestes Radarbild liegt etwa 5 bis 10 Minuten zurück
    const t0 = Math.floor((Date.now() - 8 * 60000) / STEP) * STEP;
    return Array.from({ length: 25 }, (_, i) => new Date(t0 + i * STEP));
  }

  async function loadPoint(lat, lon) {
    const date = new Date(Date.now() - 10 * 60000).toISOString();
    const r = await fetch(`${BRIGHTSKY}?lat=${lat}&lon=${lon}&distance=1000&format=plain&date=${encodeURIComponent(date)}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const x = Math.round(j.latlon_position.x), y = Math.round(j.latlon_position.y);
    // Wert in 0,01 mm pro 5 Minuten -> mm/h
    return j.radar.map(f => ({ t: new Date(f.timestamp), mmh: (f.precipitation_5[y]?.[x] ?? 0) * 12 / 100 }));
  }

  async function refresh() {
    const p = load("place") || HOME;
    $("where").textContent = p.label;
    let times = frameTimes(), values = null;
    try {
      const pts = await loadPoint(p.lat, p.lon);
      const cut = Date.now() - STEP;
      const fut = pts.filter(f => +f.t >= cut);
      if (fut.length) { times = fut.map(f => f.t); values = fut.map(f => f.mmh); }
      pointOk = true;
    } catch {
      pointOk = false;
    }
    frames.forEach(f => f.layer && map.removeLayer(f.layer));
    frames = times.map((t, i) => ({ t, mmh: values ? values[i] : null }));
    idx = 0;
    rebuildRadar();
    renderAnswer();
    renderStrip();
    select(0);
  }

  function rebuildRadar() {
    frames.forEach(f => {
      if (f.layer) map.removeLayer(f.layer);
      f.layer = new RadarLayer({ time: f.t.toISOString(), tileSize: 512, opacity: 0, zIndex: 300, updateWhenIdle: true }).addTo(map);
    });
    if (frames[idx]) frames[idx].layer.setOpacity(1);
  }

  // ---------- Antwort ----------
  function renderAnswer() {
    const a = $("answer"), h = $("headline"), s = $("sub");
    a.classList.remove("dry", "wet");
    if (!pointOk) {
      h.textContent = "Vorhersage gerade nicht erreichbar";
      s.textContent = "Die Karte zeigt trotzdem das Radar.";
      return;
    }
    const v = frames.map(f => f.mmh);
    const wet = v.map(x => x >= CLASSES[0].min);
    const maxIn = (from, to) => Math.max(...v.slice(from, to));
    const word = mmh => CLASSES[classOf(mmh)]?.word || "Regen";
    const mins = i => Math.round((frames[i].t - Date.now()) / 60000);

    if (!wet[0]) {
      const start = wet.indexOf(true);
      if (start < 0) {
        a.classList.add("dry");
        h.textContent = "Trocken bis mindestens " + fmt(frames.at(-1).t);
        s.textContent = "Kein Regen in den nächsten 2 Stunden";
      } else {
        a.classList.add(mins(start) <= 30 ? "wet" : "dry");
        h.textContent = `Regen ab ${fmt(frames[start].t)}`;
        s.textContent = `In ${Math.max(mins(start), 5)} Min. · ${word(maxIn(start, start + 6))}`;
      }
    } else {
      a.classList.add("wet");
      let end = -1;
      for (let i = 1; i < wet.length - 1; i++) if (!wet[i] && !wet[i + 1]) { end = i; break; }
      if (end < 0 && !wet.at(-1)) end = wet.length - 1;
      h.textContent = end < 0 ? "Es regnet weiter" : `Es regnet · hört gegen ${fmt(frames[end].t)} auf`;
      s.textContent = end < 0 ? `Mindestens bis ${fmt(frames.at(-1).t)} · gerade ${word(v[0])}` : `Gerade ${word(v[0])}`;
    }
  }

  // ---------- Zeitleiste ----------
  function renderStrip() {
    if (!frames.length) return;
    const bars = $("bars");
    bars.innerHTML = frames.map(f => {
      const c = f.mmh == null ? -1 : classOf(f.mmh);
      const h = c < 0 ? 3 : [14, 26, 38, 48, 56][c];
      const col = c < 0 ? "var(--line)" : `var(--r${c + 1})`;
      return `<div class="bar" style="height:${h}px;background:${col}"></div>`;
    }).join("");
    const n = frames.length - 1;
    const marks = [0, 6, 12, 18, n].filter((v, i, a) => v <= n && a.indexOf(v) === i);
    $("axis").innerHTML = marks.map(i => {
      const left = (i / n) * 100;
      return `<span style="left:${left}%" class="${i === 0 ? "now" : ""}">${i === 0 ? "jetzt" : fmt(frames[i].t)}</span>`;
    }).join("");
    $("strip").setAttribute("aria-valuemax", n);
    $("empty").hidden = !frames.every(f => f.mmh != null && f.mmh < CLASSES[0].min);
    placeCursor();
  }

  function placeCursor() {
    const strip = $("strip"), barsEl = $("bars").children;
    if (!barsEl[idx]) return;
    const b = barsEl[idx], sr = strip.getBoundingClientRect(), br = b.getBoundingClientRect();
    const x = (br.left - sr.left + br.width / 2) + "px";
    $("cursor").style.left = x; $("handle").style.left = x;
  }

  function select(i) {
    idx = Math.max(0, Math.min(frames.length - 1, i));
    frames.forEach((f, j) => f.layer && f.layer.setOpacity(j === idx ? 1 : 0));
    const f = frames[idx];
    const m = Math.round((f.t - Date.now()) / 60000);
    const rel = idx === 0 ? "jetzt" : m <= 0 ? "jetzt" : `in ${m} Min.`;
    const val = f.mmh == null ? "" : f.mmh < CLASSES[0].min ? " · trocken" : ` · ${CLASSES[classOf(f.mmh)].word}`;
    $("sel").textContent = `${fmt(f.t)} · ${rel}${val}`;
    $("strip").setAttribute("aria-valuenow", idx);
    $("strip").setAttribute("aria-valuetext", $("sel").textContent);
    placeCursor();
  }

  const strip = $("strip");
  const pick = e => {
    const r = strip.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width - 1);
    select(Math.floor((x / r.width) * frames.length));
  };
  strip.addEventListener("pointerdown", e => { strip.setPointerCapture(e.pointerId); strip.classList.add("dragging"); pick(e); });
  const endDrag = () => strip.classList.remove("dragging");
  strip.addEventListener("pointerup", endDrag);
  strip.addEventListener("pointercancel", endDrag);
  strip.addEventListener("pointermove", e => { if (strip.hasPointerCapture(e.pointerId)) pick(e); });
  strip.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") select(idx + 1);
    if (e.key === "ArrowLeft") select(idx - 1);
  });

  // ---------- Ort ----------
  let meMarker = null;
  function setPlace(lat, lon, label) {
    save("place", { lat, lon, label });
    const ll = [lat, lon];
    if (!meMarker) meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
    else meMarker.setLatLng(ll);
    refresh();
  }
  function locate(silent) {
    if (!navigator.geolocation) { if (!silent) toast("Standort wird von diesem Gerät nicht unterstützt"); return; }
    navigator.geolocation.getCurrentPosition(p => {
      const { latitude: lat, longitude: lon } = p.coords;
      map.setView([lat, lon], PLACE_ZOOM);
      setPlace(lat, lon, "Dein Standort");
    }, () => {
      if (!silent) toast("Standort nicht freigegeben. Tippe auf die Karte, um einen Ort zu wählen.");
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
  }
  $("locate").addEventListener("click", () => locate(false));
  map.on("click", e => {
    setPlace(+e.latlng.lat.toFixed(4), +e.latlng.lng.toFixed(4), "Gewählter Ort");
    toast("Vorhersage für den gewählten Ort");
  });

  // ---------- Hilfen ----------
  let toastT;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
  }
  const syncSheet = () => document.documentElement.style.setProperty("--sheet-h", $("sheet").offsetHeight + "px");
  new ResizeObserver(() => { syncSheet(); placeCursor(); }).observe($("sheet"));

  // Alle 5 Minuten und beim Zurückkehren in die App aktualisieren
  let last = 0;
  const maybeRefresh = () => { if (document.visibilityState === "visible" && Date.now() - last > 4 * 60000) { last = Date.now(); refresh(); } };
  document.addEventListener("visibilitychange", maybeRefresh);
  setInterval(maybeRefresh, 60000);

  // ---------- Start ----------
  applyTheme();
  setBase();
  const p0 = load("place") || HOME;
  meMarker = L.marker([p0.lat, p0.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
  last = Date.now();
  refresh();
  // GPS beim Start nur nachziehen, wenn der Ort der Standort ist (oder noch keiner gewählt wurde).
  // Ein per Tipp gewählter Ort bleibt erhalten.
  const saved = load("place");
  if (!saved || saved.label === "Dein Standort") locate(true);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
