<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Regenradar</title>
<meta name="theme-color" content="#eef1f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Regenradar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://maps.dwd.de" crossorigin>
<link rel="preconnect" href="https://api.brightsky.dev" crossorigin>
<link rel="preconnect" href="https://services.arcgisonline.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&icon_names=contrast,dark_mode,drag_indicator,light_mode,my_location,refresh,water_drop&display=block" media="print" onload="this.media='all'">
<style>
/* Layout: Antwort oben, Karte in der Mitte, Regenverlauf für deinen Ort unten als Zeitleiste */
:root {
  --bg: #e9edf1;
  --panel: rgba(255,255,255,.94);
  --panel-solid: #ffffff;
  --fg: #0f1b26;
  --muted: #5a6977;
  --line: #d5dde4;
  --accent: #1f6fd6;
  --dry: #23784a;
  --shadow: 0 6px 24px rgba(15,27,38,.14);
  /* Regenstufen, gleich in Hell und Dunkel: je mehr Regen, desto dunkler und kräftiger.
     Farbton wandert von Hellblau über Blau und Violett zu Magenta. */
  --r1: #a3cff5; --r2: #6aaef3; --r3: #437cf0; --r4: #7e43e4; --r5: #af0e7f;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #12161b;
  --panel: rgba(24,30,37,.94);
  --panel-solid: #181e25;
  --fg: #e8edf2;
  --muted: #93a2b0;
  --line: #2c3742;
  --accent: #5aa2ff;
  --dry: #5cc28b;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.35 var(--font); overflow: hidden; overscroll-behavior: none; }
#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-control-attribution { font-size: 10px; background: var(--panel) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bottom { bottom: var(--sheet-h, 220px); }

.panel {
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow);
}

/* Antwortkarte */
.top {
  position: fixed; left: 12px; right: 12px; z-index: 500;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; gap: 8px; align-items: flex-start;
}
.answer { flex: 1; min-width: 0; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.drop { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--muted); }
.ms { font-family: "Material Symbols Rounded"; font-weight: 500; font-style: normal; line-height: 1; letter-spacing: normal;
  text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; user-select: none;
  font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; display: inline-block; overflow: hidden; }
.drop .ms { font-size: 20px; }
.answer.dry .drop { background: color-mix(in srgb, var(--dry) 18%, transparent); color: var(--dry); }
.answer.wet .drop { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.answer .txt { min-width: 0; }
.answer h1 { margin: 0; font-size: 19px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; text-wrap: balance; }
.answer p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.answer .where { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.btns { display: flex; flex-direction: column; gap: 8px; }
.iconbtn {
  width: 48px; height: 48px; border: 0; border-radius: 14px; color: var(--fg);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.iconbtn.busy .ms { animation: spin .9s linear infinite; }
.iconbtn .ms { font-size: 22px; display: block; margin-inline: auto; width: 22px; height: 22px; }
.iconbtn small { display: block; font: 600 11px var(--font); margin-top: -3px; color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Unteres Panel */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 500;
  border-radius: 20px 20px 0 0;
  padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column; gap: 10px;
}
.head { height: 20px; display: flex; align-items: center; min-width: 0; }
.head .sel { font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.strip { position: relative; height: 118px; touch-action: none; cursor: pointer; user-select: none; margin-inline: 12px; }
.bars { position: absolute; inset: 0 0 56px 0; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); }
.empty { position: absolute; inset: 0 0 56px 0; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--dry); pointer-events: none; }
.bar { flex: 1; min-width: 0; border-radius: 3px 3px 0 0; background: var(--line); height: 3px; transition: height .25s; }
.bar.sel { box-shadow: 0 0 0 2px var(--fg); }
.cursor { position: absolute; top: 0; bottom: 16px; width: 2px; background: var(--fg); border-radius: 1px; pointer-events: none; transform: translateX(-1px); }
.handle {
  position: absolute; bottom: 0; width: 32px; height: 32px; margin-left: -16px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--fg); box-shadow: var(--shadow);
  display: grid; place-items: center; pointer-events: none; transition: transform .12s;
}
.handle .ms { font-size: 20px; color: var(--fg); }
.strip.dragging .handle { transform: scale(1.15); }
.strip:focus-visible .handle { outline: 2px solid var(--accent); outline-offset: 2px; }
.axis { position: absolute; left: 0; right: 0; bottom: 38px; height: 15px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; padding-inline: 3px; background: var(--panel-solid); z-index: 1; }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.axis .now { color: var(--fg); font-weight: 600; }

.legend { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.legend div { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); min-width: 0; }
.legend i { display: block; height: 6px; border-radius: 3px; }
.legend span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--sheet-h, 220px) + 12px); z-index: 600;
  border-radius: 12px; padding: 8px 12px; font-size: 12px; max-width: calc(100% - 32px); }
.leaflet-image-layer.radar { transition: none !important; }
.me { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }
/* Skeleton beim ersten Laden */
.sk { color: transparent !important; white-space: nowrap; overflow: hidden; border-radius: 6px; background: linear-gradient(90deg, var(--line) 0 40%, color-mix(in srgb, var(--line) 45%, var(--panel-solid)) 50%, var(--line) 60% 100%);
  background-size: 300% 100%; animation: sk 1.4s linear infinite; }
#headline.sk { width: 12em; max-width: 100%; }
#sub.sk { width: 9em; max-width: 80%; margin-top: 6px; }
#where.sk { width: 5em; }
#sel.sk { width: 11em; display: inline-block; }
.bar.skb { animation: sk 1.4s linear infinite; background: linear-gradient(90deg, var(--line) 0 40%, color-mix(in srgb, var(--line) 45%, var(--panel-solid)) 50%, var(--line) 60% 100%) fixed; background-size: 300% 100%; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
.booting .handle, .booting .cursor { opacity: 0; }

/* Ladeanzeige für Radarbilder */
.head { justify-content: space-between; gap: 8px; }
.loadchip { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.loadchip.err { color: var(--fg); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.loadchip.err .spin { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .sk, .bar.skb { animation: none; } .spin { animation-duration: 2.4s; } }
</style>
</head>
<body class="booting">
<div id="map" aria-label="Karte mit Regenradar"></div>

<div class="top">
  <div class="panel answer" id="answer" aria-live="polite">
    <div class="drop" aria-hidden="true">
      <span class="ms">water_drop</span>
    </div>
    <div class="txt">
      <h1 id="headline" class="sk">Lade Vorhersage …</h1>
      <p id="sub" class="sk">Regen für die nächsten 2 Stunden</p>
      <span class="where sk" id="where">Ort</span>
    </div>
  </div>
  <div class="btns">
    <button class="panel iconbtn" id="locate" aria-label="Meinen Standort verwenden">
      <span class="ms" aria-hidden="true">my_location</span>
    </button>
    <button class="panel iconbtn" id="reload" aria-label="Radar aktualisieren">
      <span class="ms" aria-hidden="true">refresh</span>
    </button>
    <button class="panel iconbtn" id="theme" aria-label="Darstellung wechseln">
      <span><span class="ms" id="themeIco" aria-hidden="true">contrast</span><small id="themeLbl">Auto</small></span>
    </button>
  </div>
</div>

<div class="panel toast" id="toast" hidden></div>

<div class="panel sheet" id="sheet">
  <div class="head">
    <span class="sel sk" id="sel">--:--</span>
    <span class="loadchip" id="loadchip" role="status" hidden><span class="spin" aria-hidden="true"></span><span id="loadtxt">Radar lädt</span></span>
  </div>
  <div class="strip" id="strip" role="slider" aria-label="Zeitpunkt wählen" tabindex="0" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0">
    <div class="bars" id="bars"></div>
    <div class="empty" id="empty" hidden>Durchgehend trocken</div>
    <div class="cursor" id="cursor"></div>
    <div class="handle" id="handle" aria-hidden="true"><span class="ms">drag_indicator</span></div>
    <div class="axis" id="axis"></div>
  </div>
    <div class="legend" aria-label="Legende">
      <div><i style="background:var(--r1)"></i><span>Niesel</span></div>
      <div><i style="background:var(--r2)"></i><span>leicht</span></div>
      <div><i style="background:var(--r3)"></i><span>mäßig</span></div>
      <div><i style="background:var(--r4)"></i><span>stark</span></div>
      <div><i style="background:var(--r5)"></i><span>Unwetter</span></div>
    </div>
</div>

<script>
  // Skeleton-Balken sofort zeichnen, noch bevor Karte und Daten geladen sind
  document.getElementById("bars").innerHTML = Array.from({ length: 25 }, (_, i) =>
    `<div class="bar skb" style="height:${10 + ((i * 7) % 5) * 6}px"></div>`).join("");
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  // ---------- Konfiguration ----------
  const WMS = "https://maps.dwd.de/geoserver/dwd/wms";
  const LAYER = "dwd:Niederschlagsradar";      // mm/h, Messung + Nowcast bis +2 h
  const BRIGHTSKY = "https://api.brightsky.dev/radar";
  const HOME = { lat: 53.5511, lon: 9.9937, label: "Hamburg" };
  const STEP = 5 * 60000;
  const PLACE_ZOOM = 10;   // Startansicht: Ort mit Umgebung von etwa 30 km

  // Klassen in mm/h. Gleiche Schwellen für Karte und Punktwert.
  // Schwellen exakt wie die DWD-Farbskala der Karte (Werte dort in mm pro 5 Minuten, hier × 12 = mm/h).
  // So bedeuten Kartenfarbe und Text immer dasselbe.
  const CLASSES = [
    { min: 0.008 * 12, word: "Niesel" },          // ab 0,1 mm/h
    { min: 0.033 * 12, word: "leichter Regen" },  // ab 0,4 mm/h
    { min: 0.167 * 12, word: "mäßiger Regen" },   // ab 2 mm/h
    { min: 0.417 * 12, word: "starker Regen" },   // ab 5 mm/h
    { min: 1.25 * 12,  word: "Unwetter" },        // ab 15 mm/h
  ];
  const classOf = mmh => { let c = -1; CLASSES.forEach((k, i) => { if (mmh >= k.min) c = i; }); return c; };

  // DWD-Farbpalette (aus GetLegendGraphic) -> unsere Klasse
  const DWD_PALETTE = {
    "33FFFF": 0, "1ACC9A": 0,
    "019934": 1, "4DB31B": 1,
    "99CC01": 2, "CCE601": 2,
    "FFFF01": 3, "FFC401": 3, "FF8901": 3,
    "FF4501": 4, "FE0000": 4, "E5004C": 4, "CC0098": 4, "6600CB": 4, "0000FE": 4,
  };
  const LUT = new Map(Object.entries(DWD_PALETTE).map(([hex, c]) => [parseInt(hex, 16), c]));

  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = d => d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  const load = k => { try { return JSON.parse(localStorage.getItem("rr." + k)); } catch { return null; } };
  const save = (k, v) => { try { localStorage.setItem("rr." + k, JSON.stringify(v)); } catch {} };

  // ---------- Theme ----------
  const sys = matchMedia("(prefers-color-scheme: dark)");
  let themeMode = load("theme") || "auto";   // auto | light | dark
  let classRGBA = [];
  const ICONS = { auto: "contrast", light: "light_mode", dark: "dark_mode" };   // Material Symbols
  const isDark = () => themeMode === "dark" || (themeMode === "auto" && sys.matches);

  function applyTheme() {
    const dark = isDark();
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = dark ? "#12161b" : "#e9edf1";
    $("themeIco").textContent = ICONS[themeMode];
    $("themeLbl").textContent = { auto: "Auto", light: "Hell", dark: "Dunkel" }[themeMode];
    classRGBA = ["--r1", "--r2", "--r3", "--r4", "--r5"].map((v, i) => {
      const h = css(v).replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), [190, 210, 230, 240, 245][i]];
    });
    if (map) { setBase(); rebuildRadar(); renderStrip(); }
  }
  $("theme").addEventListener("click", () => {
    themeMode = { auto: "light", light: "dark", dark: "auto" }[themeMode];
    save("theme", themeMode); applyTheme();
    toast({ auto: "Darstellung folgt dem System", light: "Helle Darstellung", dark: "Dunkle Darstellung" }[themeMode]);
  });
  sys.addEventListener?.("change", () => themeMode === "auto" && applyTheme());

  // ---------- Karte ----------
  let map = null;
  const place = load("place") || HOME;
  map = L.map("map", { zoomControl: false, minZoom: 5, maxZoom: 13 })
    .setView([place.lat, place.lon], PLACE_ZOOM);
  map.attributionControl.setPrefix(false);

  const ESRI = "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  const baseLayer = L.tileLayer("", { maxZoom: 16, attribution: 'Karte: Esri, HERE, Garmin, &copy; OpenStreetMap | Radar: <a href="https://www.dwd.de">Deutscher Wetterdienst</a>, <a href="https://brightsky.dev">Bright Sky</a>' }).addTo(map);
  const labelPane = map.createPane("labels"); labelPane.style.zIndex = 450; labelPane.style.pointerEvents = "none";
  const labelLayer = L.tileLayer("", { maxZoom: 16, pane: "labels" }).addTo(map);
  function setBase() {
    const v = isDark() ? "World_Dark_Gray" : "World_Light_Gray";
    baseLayer.setUrl(`${ESRI}${v}_Base/MapServer/tile/{z}/{y}/{x}`);
    labelLayer.setUrl(`${ESRI}${v}_Reference/MapServer/tile/{z}/{y}/{x}`);
  }

  // Radar-Kacheln: DWD-WMS laden, in Regenklassen übersetzen, Kanten weich rechnen, neu einfärben.
  // Glättung: Klassenfeld weichzeichnen und wieder in Klassen schneiden. Ergibt runde Konturen
  // mit klaren Grenzen statt 1-km-Treppen. Die Kachel wird mit Rand geladen, damit keine Nähte entstehen.
  const CAN_BLUR = "filter" in CanvasRenderingContext2D.prototype;
  const STEPV = 42;   // Grauwert pro Klasse im Hilfsbild
  const EMPTY = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

  // ---------- Ladesteuerung ----------
  // Höchstens 8 Radar-Anfragen gleichzeitig. Das gerade gezeigte Bild hat Vorrang.
  const MAX_PAR = 8; let active = 0; const queue = [];
  function enqueue(job, prio) {
    return new Promise((res, rej) => {
      const run = () => Promise.resolve().then(job).then(res, rej);
      prio ? queue.unshift(run) : queue.push(run);
      pump();
    });
  }
  function pump() {
    while (active < MAX_PAR && queue.length) {
      const run = queue.shift(); active++;
      run().finally(() => { active--; pump(); });
    }
  }

  // Ein Bild pro Zeitpunkt statt vieler Kacheln. Der DWD-Server braucht pro Anfrage
  // 1 bis 3 Sekunden, fast unabhängig von der Bildgröße. Deshalb wird pro Zeitpunkt nur ein
  // Bild angefragt, das den sichtbaren Ausschnitt plus einen Rand abdeckt. Kleines Verschieben
  // lädt nichts nach; erst bei neuem Zoom oder größerem Verschieben wird ein neuer Ausschnitt gerechnet.
  let view = null;          // aktueller Ausschnitt: {id, zoom, bounds, bbox, W, H, pad, blur}
  let viewSeq = 0;
  const frameCache = new Map();   // "ausschnitt|zeit" -> Promise<url>
  function revokeWhere(pred) {
    [...frameCache.keys()].forEach(k => {
      if (!pred(k)) return;
      const p = frameCache.get(k); frameCache.delete(k);
      p.then(u => { if (u !== EMPTY && u !== shownUrl) URL.revokeObjectURL(u); }, () => {});
    });
  }
  function makeView() {
    const size = map.getSize(), z = map.getZoom();
    const crs = L.CRS.EPSG3857;
    // Ausschnitt: sichtbarer Bereich, auf jeder Seite um die halbe Breite/Höhe erweitert
    const b = map.getBounds();
    const sw = crs.project(b.getSouthWest()), ne = crs.project(b.getNorthEast());
    const mx = (ne.x - sw.x) * 0.5, my = (ne.y - sw.y) * 0.5;
    let W = size.x * 2, H = size.y * 2;
    const scale = Math.min(1, 2048 / Math.max(W, H));          // Serverlimit und Speicher schonen
    W = Math.round(W * scale); H = Math.round(H * scale);
    const x0 = sw.x - mx, x1 = ne.x + mx, y0 = sw.y - my, y1 = ne.y + my;
    const res = (x1 - x0) / W;
    const lat = map.getCenter().lat * Math.PI / 180;
    const cellPx = 1000 / Math.cos(lat) / res;                  // ein 1-km-Rasterfeld in Pixeln
    const blur = CAN_BLUR ? Math.min(24, cellPx * 0.6) : 0;
    const pad = blur >= 0.5 ? Math.ceil(blur * 2) + 2 : 0;
    const bounds = L.latLngBounds(crs.unproject(L.point(x0, y0)), crs.unproject(L.point(x1, y1)));
    return { id: ++viewSeq, zoom: z, bounds, x0, x1, y0, y1, res, W, H, pad, blur };
  }
  function viewCovers(v) {
    return v && v.zoom === map.getZoom() && v.bounds.contains(map.getBounds());
  }

  // Bildverarbeitung im Hintergrund-Thread (Web Worker), damit Scrubben und Karte flüssig bleiben.
  // Fällt auf den Haupt-Thread zurück, wenn der Browser das nicht kann.
  const PROCESS_SRC = `
    async function processFrame(o) {
      const r = await fetch(o.url);
      if (!r.ok) throw new Error(r.status);
      const bmp = await createImageBitmap(await r.blob());
      const mk = (w, h) => typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(w, h) : Object.assign(document.createElement("canvas"), { width: w, height: h });
      const lut = new Map(o.lut);
      // 1. DWD-Farben in Klassen übersetzen (0 = kein Regen, 1..5 = Stufen) als Graubild
      const src = mk(o.W, o.H), sctx = src.getContext("2d", { willReadFrequently: true });
      sctx.drawImage(bmp, 0, 0); bmp.close && bmp.close();
      const si = sctx.getImageData(0, 0, o.W, o.H), s = si.data;
      let any = false;
      for (let i = 0; i < s.length; i += 4) {
        const c = s[i + 3] === 255 ? lut.get((s[i] << 16) | (s[i + 1] << 8) | s[i + 2]) : undefined;
        const v = c === undefined ? 0 : (c + 1) * o.stepv;
        if (v) any = true;
        s[i] = s[i + 1] = s[i + 2] = v; s[i + 3] = 255;
      }
      if (!any) return null;
      sctx.putImageData(si, 0, 0);
      // 2. Weichzeichnen: Klassenfeld weich, dann wieder in Stufen schneiden = runde Konturen
      const soft = mk(o.W, o.H), fctx = soft.getContext("2d", { willReadFrequently: true });
      if (o.blur >= 0.5 && "filter" in fctx) fctx.filter = "blur(" + o.blur.toFixed(1) + "px)";
      fctx.drawImage(src, 0, 0);
      const fd = fctx.getImageData(o.pad, o.pad, o.w, o.hh), f = fd.data;
      // 3. Einfärben
      for (let i = 0; i < f.length; i += 4) {
        const c = Math.round(f[i] / o.stepv) - 1;
        if (c < 0) { f[i + 3] = 0; continue; }
        const t = o.rgba[Math.min(c, 4)]; f[i] = t[0]; f[i + 1] = t[1]; f[i + 2] = t[2]; f[i + 3] = t[3];
      }
      const out = mk(o.w, o.hh);
      out.getContext("2d").putImageData(fd, 0, 0);
      return out.convertToBlob ? out.convertToBlob({ type: "image/png" }) : new Promise(r => out.toBlob(r, "image/png"));
    }
  `;
  let workers = [], nextWorker = 0, jobSeq = 0;
  const jobs = new Map();
  try {
    const off = typeof OffscreenCanvas !== "undefined" && "filter" in new OffscreenCanvas(1, 1).getContext("2d");
    if (off) {
      const wurl = URL.createObjectURL(new Blob([PROCESS_SRC + `
        onmessage = async e => {
          try { postMessage({ id: e.data.id, blob: await processFrame(e.data.o) }); }
          catch (err) { postMessage({ id: e.data.id, err: String(err) }); }
        };`], { type: "text/javascript" }));
      workers = [new Worker(wurl), new Worker(wurl)];
      workers.forEach(w => w.onmessage = e => {
        const j = jobs.get(e.data.id); if (!j) return; jobs.delete(e.data.id);
        e.data.err ? j.rej(new Error(e.data.err)) : j.res(e.data.blob);
      });
    }
  } catch { workers = []; }
  const mainProcess = new Function(PROCESS_SRC + "; return processFrame;")();
  function processFrame(o) {
    if (!workers.length) return mainProcess(o);
    const id = ++jobSeq, w = workers[nextWorker++ % workers.length];
    return new Promise((res, rej) => { jobs.set(id, { res, rej }); w.postMessage({ id, o }); });
  }

  function renderFrame(v, time, prio, run) {
    const key = `${v.id}|${time}`;
    if (frameCache.has(key)) return frameCache.get(key);
    const p = enqueue(async () => {
      if (run !== undefined && run !== preloadRun) throw new Error("veraltet");
      const { W: w, H: hh, pad, res } = v;
      const W = w + 2 * pad, H = hh + 2 * pad;
      const bbox = [v.x0 - pad * res, v.y0 - pad * res, v.x1 + pad * res, v.y1 + pad * res].join(",");
      const url = `${WMS}?service=WMS&version=1.3.0&request=GetMap&layers=${LAYER}&styles=&format=image/png&transparent=true` +
        `&crs=EPSG:3857&width=${W}&height=${H}&bbox=${bbox}&time=${time}`;
      const blob = await processFrame({ url, W, H, w, hh, pad, blur: v.blur, stepv: STEPV, lut: [...LUT], rgba: classRGBA });
      if (!blob) return EMPTY;
      return URL.createObjectURL(blob);
    }, prio);
    frameCache.set(key, p);
    p.catch(() => frameCache.delete(key));   // Fehler nicht cachen
    return p;
  }

  // ---------- Zustand ----------
  let frames = [];     // {t: Date, mmh: number|null, layer}
  let idx = 0, timer = null, pointOk = false;

  function frameTimes() {
    // Neuestes Radarbild liegt etwa 5 bis 10 Minuten zurück
    const t0 = Math.floor((Date.now() - 8 * 60000) / STEP) * STEP;
    return Array.from({ length: 25 }, (_, i) => new Date(t0 + i * STEP));
  }

  // Regen am Ort: direkt aus derselben DWD-Ebene wie die Karte (GetFeatureInfo), alle Zeitpunkte in einer Anfrage.
  // Gleiche Daten, gleicher Vorhersagelauf, volle Genauigkeit.
  async function loadPoint(lat, lon) {
    const e = 0.005, iso = d => d.toISOString().replace(/\.\d+Z$/, ".000Z");
    const from = new Date(Math.floor((Date.now() - 15 * 60000) / STEP) * STEP), to = new Date(+from + 140 * 60000);
    const url = `${WMS}?service=WMS&version=1.1.1&request=GetFeatureInfo&layers=${LAYER}&query_layers=${LAYER}&styles=` +
      `&srs=EPSG:4326&bbox=${lon - e},${lat - e},${lon + e},${lat + e}&width=3&height=3&x=1&y=1` +
      `&info_format=application/json&feature_count=100&time=${iso(from)}/${iso(to)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const feats = (await r.json()).features || [];
    if (!feats.length) throw new Error("keine Daten");   // z. B. außerhalb der Radarabdeckung
    return feats.map(f => {
      const pr = f.properties, v = pr.RV_ANALYSIS ?? Object.values(pr).find(x => typeof x === "number") ?? 0;
      return { t: new Date(pr.TIME), mmh: Math.max(0, v) * 12 };   // mm pro 5 Min. -> mm/h
    }).sort((a, b) => a.t - b.t);
  }
  // Ersatz, falls der DWD-Server nicht antwortet. Bright Sky rundet auf 0,01 mm ab, daher etwas ungenauer.
  async function loadPointBrightSky(lat, lon) {
    const date = new Date(Date.now() - 10 * 60000).toISOString();
    const r = await fetch(`${BRIGHTSKY}?lat=${lat}&lon=${lon}&distance=1000&format=plain&date=${encodeURIComponent(date)}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const x = Math.round(j.latlon_position.x), y = Math.round(j.latlon_position.y);
    // Wert in 0,01 mm pro 5 Minuten -> mm/h
    return j.radar.map(f => ({ t: new Date(f.timestamp), mmh: (f.precipitation_5[y]?.[x] ?? 0) * 12 / 100 }));
  }

  let lastRefresh = 0, refreshing = false;
  async function refresh() {
    if (refreshing) return;
    refreshing = true; lastRefresh = Date.now();
    $("reload").classList.add("busy");
    const p = load("place") || HOME;
    const keepTime = frames[idx] && idx !== nowIndex() ? +frames[idx].t : null;
    let times = frameTimes(), values = null;
    try {
      const pts = await loadPoint(p.lat, p.lon).catch(() => loadPointBrightSky(p.lat, p.lon));
      const cut = Date.now() - STEP;
      const fut = pts.filter(f => +f.t >= cut);
      if (fut.length) { times = fut.map(f => f.t); values = fut.map(f => f.mmh); }
      pointOk = true;
    } catch {
      pointOk = false;
    }
    frames = times.map((t, i) => ({ t, mmh: values ? values[i] : null }));
    dropOldFrames();
    document.querySelectorAll(".sk").forEach(el => el.classList.remove("sk"));
    document.body.classList.remove("booting");
    $("where").textContent = `${p.label} · Stand ${fmt(new Date())}`;
    renderAnswer();
    renderStrip();
    const keep = keepTime ? frames.findIndex(f => +f.t === keepTime) : -1;
    select(keep >= 0 ? keep : nowIndex());
    preload();
    $("reload").classList.remove("busy");
    refreshing = false;
  }
  // Zeitpunkt, der "jetzt" am nächsten liegt
  function nowIndex() {
    let best = 0, d = Infinity;
    frames.forEach((f, j) => { const x = Math.abs(f.t - Date.now()); if (x < d) { d = x; best = j; } });
    return best;
  }
  // Bilder für Zeitpunkte, die nicht mehr in der Zeitleiste sind, freigeben
  function dropOldFrames() {
    const keep = new Set(frames.map(f => f.t.toISOString()));
    revokeWhere(k => !keep.has(k.split("|")[1]));
  }

  // Auf der Karte liegt immer nur eine Radar-Ebene: die des gewählten Zeitpunkts.
  // Die übrigen Zeitpunkte werden im Hintergrund für den sichtbaren Ausschnitt vorberechnet,
  // sobald das aktuelle Bild steht. Der Wechsel ist dann sofort da.
  let preloadRun = 0, tileErr = false, busy = false, shownUrl = null, wantKey = "";
  const overlay = L.imageOverlay(EMPTY, [[0, 0], [0, 0]], { zIndex: 300, interactive: false, className: "radar" }).addTo(map);

  // Zeitpunkt anzeigen. Das bisherige Bild bleibt stehen, bis das neue fertig dekodiert ist.
  function showFrame(i) {
    const f = frames[i]; if (!f) return;
    if (!viewCovers(view)) newView();
    const v = view, time = f.t.toISOString(), key = `${v.id}|${time}`;
    if (key === wantKey) return;
    wantKey = key; busy = true; tileErr = false; updLoading();
    renderFrame(v, time, true).then(async u => {
      if (wantKey !== key) return;
      if (u !== EMPTY) {   // vorab dekodieren, damit der Wechsel ohne Leerbild passiert (max. 400 ms warten)
        const img = new Image(); img.src = u;
        await Promise.race([img.decode().catch(() => {}), new Promise(r => setTimeout(r, 400))]);
      }
      if (wantKey !== key) return;
      overlay.setUrl(u); overlay.setBounds(v.bounds); shownUrl = u;
      busy = false; updLoading();
    }, () => { if (wantKey === key) { busy = false; tileErr = true; updLoading(); } });
  }
  function newView() {
    const old = view;
    view = makeView();
    preloadRun++;
    // Bilder älterer Ausschnitte freigeben (das gerade angezeigte bleibt, bis es ersetzt ist)
    if (old) revokeWhere(k => !k.startsWith(view.id + "|"));
  }
  function rebuildRadar() {   // nach Theme-Wechsel: Farben sind eingebacken, also neu rechnen
    revokeWhere(() => true);
    wantKey = ""; view = null;
    if (frames.length) { select(idx); preload(); }
  }
  async function preload() {
    const run = ++preloadRun, v = view;
    if (!v || !frames.length) return;
    // erst das sichtbare Bild, dann die übrigen Zeitpunkte: Nachbarn zuerst, Zukunft vor Vergangenheit
    try { await renderFrame(v, frames[idx].t.toISOString(), true); } catch {}
    const order = frames.map((_, j) => j).filter(j => j !== idx)
      .sort((a, b) => (Math.abs(a - idx) - Math.abs(b - idx)) || (b - a));
    await Promise.all(order.map(j => renderFrame(v, frames[j].t.toISOString(), false, run).catch(() => {})));
  }
  map.on("moveend", () => {
    if (viewCovers(view)) return;          // Ausschnitt reicht noch: nichts nachladen
    wantKey = "";
    if (frames.length) { select(idx); preload(); }
  });

  function updLoading() {
    const chip = $("loadchip");
    if (busy) { chip.hidden = false; chip.classList.remove("err"); $("loadtxt").textContent = "Radar lädt"; return; }
    if (tileErr) { chip.hidden = false; chip.classList.add("err"); $("loadtxt").textContent = "Radar unvollständig"; return; }
    chip.hidden = true;
  }

  // ---------- Antwort ----------
  function renderAnswer() {
    const a = $("answer"), h = $("headline"), s = $("sub");
    a.classList.remove("dry", "wet");
    if (!pointOk) {
      h.textContent = "Vorhersage gerade nicht erreichbar";
      s.textContent = "Die Karte zeigt trotzdem das Radar.";
      return;
    }
    const v = frames.map(f => f.mmh);
    const wet = v.map(x => x >= CLASSES[0].min);
    const maxIn = (from, to) => Math.max(...v.slice(from, to));
    const word = mmh => CLASSES[classOf(mmh)]?.word || "Regen";
    const mins = i => Math.round((frames[i].t - Date.now()) / 60000);

    if (!wet[0]) {
      const start = wet.indexOf(true);
      if (start < 0) {
        a.classList.add("dry");
        h.textContent = "Trocken bis mindestens " + fmt(frames.at(-1).t);
        s.textContent = "Kein Regen in den nächsten 2 Stunden";
      } else {
        a.classList.add(mins(start) <= 30 ? "wet" : "dry");
        h.textContent = `Regen ab ${fmt(frames[start].t)}`;
        s.textContent = `In ${Math.max(mins(start), 5)} Min. · ${word(maxIn(start, start + 6))}`;
      }
    } else {
      a.classList.add("wet");
      let end = -1;
      for (let i = 1; i < wet.length - 1; i++) if (!wet[i] && !wet[i + 1]) { end = i; break; }
      if (end < 0 && !wet.at(-1)) end = wet.length - 1;
      h.textContent = end < 0 ? "Es regnet weiter" : `Es regnet · hört gegen ${fmt(frames[end].t)} auf`;
      s.textContent = end < 0 ? `Mindestens bis ${fmt(frames.at(-1).t)} · gerade ${word(v[0])}` : `Gerade ${word(v[0])}`;
    }
  }

  // ---------- Zeitleiste ----------
  function renderStrip() {
    if (!frames.length) return;
    const bars = $("bars");
    bars.innerHTML = frames.map(f => {
      const c = f.mmh == null ? -1 : classOf(f.mmh);
      const h = c < 0 ? 3 : [14, 26, 38, 48, 56][c];
      const col = c < 0 ? "var(--line)" : `var(--r${c + 1})`;
      return `<div class="bar" style="height:${h}px;background:${col}"></div>`;
    }).join("");
    const n = frames.length - 1;
    const ni = nowIndex();
    const marks = [ni, 6, 12, 18, n].filter((v, i, a) => v <= n && a.indexOf(v) === i && (i === 0 || v - ni >= 4));
    $("axis").innerHTML = marks.map(i => {
      const left = (i / n) * 100;
      const isNow = i === ni;
      return `<span style="left:${left}%" class="${isNow ? "now" : ""}">${isNow ? "jetzt" : fmt(frames[i].t)}</span>`;
    }).join("");
    $("strip").setAttribute("aria-valuemax", n);
    $("empty").hidden = !frames.every(f => f.mmh != null && f.mmh < CLASSES[0].min);
    placeCursor();
  }

  function placeCursor() {
    const strip = $("strip"), barsEl = $("bars").children;
    if (!barsEl[idx]) return;
    const b = barsEl[idx], sr = strip.getBoundingClientRect(), br = b.getBoundingClientRect();
    const x = Math.round(br.left - sr.left + br.width / 2) + "px";   // ganze Pixel, damit der Griff scharf bleibt
    $("cursor").style.left = x; $("handle").style.left = x;
  }

  function select(i) {
    idx = Math.max(0, Math.min(frames.length - 1, i));
    showFrame(idx);
    const f = frames[idx];
    const m = Math.round((f.t - Date.now()) / 60000);
    const rel = idx === nowIndex() ? "jetzt" : m < 0 ? `vor ${-m} Min.` : `in ${m} Min.`;
    const val = f.mmh == null ? "" : f.mmh < CLASSES[0].min ? " · trocken" : ` · ${CLASSES[classOf(f.mmh)].word}`;
    $("sel").textContent = `${fmt(f.t)} · ${rel}${val}`;
    $("strip").setAttribute("aria-valuenow", idx);
    $("strip").setAttribute("aria-valuetext", $("sel").textContent);
    placeCursor();
  }

  const strip = $("strip");
  const pick = e => {
    const r = strip.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width - 1);
    select(Math.floor((x / r.width) * frames.length));
  };
  strip.addEventListener("pointerdown", e => { strip.setPointerCapture(e.pointerId); strip.classList.add("dragging"); pick(e); });
  const endDrag = () => strip.classList.remove("dragging");
  strip.addEventListener("pointerup", endDrag);
  strip.addEventListener("pointercancel", endDrag);
  strip.addEventListener("pointermove", e => { if (strip.hasPointerCapture(e.pointerId)) pick(e); });
  strip.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") select(idx + 1);
    if (e.key === "ArrowLeft") select(idx - 1);
  });

  // ---------- Ort ----------
  let meMarker = null;
  function setPlace(lat, lon, label) {
    save("place", { lat, lon, label });
    const ll = [lat, lon];
    if (!meMarker) meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
    else meMarker.setLatLng(ll);
    refresh();
  }
  function locate(silent) {
    if (!navigator.geolocation) { if (!silent) toast("Standort wird von diesem Gerät nicht unterstützt"); return; }
    navigator.geolocation.getCurrentPosition(p => {
      const { latitude: lat, longitude: lon } = p.coords;
      map.setView([lat, lon], PLACE_ZOOM);
      setPlace(lat, lon, "Dein Standort");
    }, () => {
      if (!silent) toast("Standort nicht freigegeben. Tippe auf die Karte, um einen Ort zu wählen.");
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 120000 });
  }
  $("locate").addEventListener("click", () => locate(false));
  map.on("click", e => {
    setPlace(+e.latlng.lat.toFixed(4), +e.latlng.lng.toFixed(4), "Gewählter Ort");
    toast("Vorhersage für den gewählten Ort");
  });

  // ---------- Hilfen ----------
  let toastT;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
  }
  const syncSheet = () => document.documentElement.style.setProperty("--sheet-h", $("sheet").offsetHeight + "px");
  new ResizeObserver(() => { syncSheet(); placeCursor(); }).observe($("sheet"));

  // Alle 5 Minuten und beim Zurückkehren in die App aktualisieren
  // DWD liefert alle 5 Minuten ein neues Bild. Nicht nachladen, während der Griff gezogen wird.
  const maybeRefresh = () => {
    if (document.visibilityState !== "visible" || strip.classList.contains("dragging")) return;
    if (Date.now() - lastRefresh >= 5 * 60000) refresh();
    else if (frames.length) select(idx);   // "in X Min." aktuell halten
  };
  document.addEventListener("visibilitychange", maybeRefresh);
  window.addEventListener("focus", maybeRefresh);
  setInterval(maybeRefresh, 30000);
  $("reload").addEventListener("click", () => { refresh(); toast("Radar wird aktualisiert"); });

  // ---------- Start ----------
  applyTheme();
  setBase();
  const p0 = load("place") || HOME;
  meMarker = L.marker([p0.lat, p0.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false }).addTo(map);
  refresh();
  // GPS beim Start nur nachziehen, wenn der Ort der Standort ist (oder noch keiner gewählt wurde).
  // Ein per Tipp gewählter Ort bleibt erhalten.
  const saved = load("place");
  if (!saved || saved.label === "Dein Standort") locate(true);

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
